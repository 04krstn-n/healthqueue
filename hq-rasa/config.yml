recipe: default.v1
language: en

pipeline:
  # Tokenizer
  - name: WhitespaceTokenizer

  # Featurizers
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4

  # Entity extraction
  - name: DIETClassifier
    epochs: 150
    constrain_similarities: true
    entity_recognition: true
    # Higher confidence threshold for better precision
    ranking_length: 5

  - name: EntitySynonymMapper

  # Response selection (for FAQ)
  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true

  # Fallback — raised threshold for better handling of ambiguous inputs
  - name: FallbackClassifier
    threshold: 0.55
    ambiguity_threshold: 0.10

policies:
  # Exact story memorization
  - name: MemoizationPolicy
    max_history: 8

  # Rule-based policy — must be present for rules.yml to work
  - name: RulePolicy
    core_fallback_threshold: 0.40
    core_fallback_action_name: "action_default_fallback"
    enable_fallback_prediction: true

  # ML-based dialogue policy — longer history for better context
  - name: TEDPolicy
    max_history: 8
    epochs: 150
    constrain_similarities: true
    # Reduce over-fitting in short conversations
    batch_size:
      - 32
      - 64

assistant_id: hqplus-rasa-v2
