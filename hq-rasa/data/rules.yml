version: "3.1"

rules:

- rule: Say goodbye anytime
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Respond to greet
  steps:
    - intent: greet
    - action: utter_greet

- rule: Handle bot challenge
  steps:
    - intent: bot_challenge
    - action: utter_bot_challenge

- rule: Out of scope
  steps:
    - intent: out_of_scope
    - action: utter_out_of_scope

- rule: Fallback to default
  steps:
    - intent: nlu_fallback
    - action: utter_default
